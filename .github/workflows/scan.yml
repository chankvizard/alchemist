name: Daily Pre-Market Scan

on:
  schedule:
    # 08:30 WIB = 01:30 UTC
    - cron: '30 1 * * 1-5'   # weekdays only
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit results back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scanner
        run: python alchemist_scanner_v3.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/history/
          git diff --staged --quiet || git commit -m "scan: $(date -u +%Y-%m-%d)"
          git push